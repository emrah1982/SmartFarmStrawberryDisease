# Model kütüğü — hiyerarşik (çok modelli) mimari
#
# NEDEN TEK MODEL DEĞİL?
#     Tek modelde bütün sınıflar birbirine karışır. Yaşanan somut örnek:
#     olgunluk sınıfları (yeşil meyve) yaprakları "olgunlaşmamış çilek"
#     sanıyordu, çünkü model her ikisini de aynı görüntüde ayırt etmek
#     zorundaydı. Eşik yükseltmek gerçek meyveleri de eledi.
#
#     Hiyerarşik yapıda olgunluk modeli YALNIZCA meyve kırpıntısı görür;
#     bir yaprağı olgunlaşmamış meyve diye işaretlemesi yapısal olarak
#     imkânsız hale gelir. Sorun eşikle bastırılmaz, ortadan kalkar.
#
# AKIŞ
#     görüntü → organ → ROI kırpma → ilgili uzman model → birleştirme
#
# ALANLAR
#   dosya      : models/ altındaki ağırlık dosyası
#   rol        : organ | yaprak_hastalik | meyve_hastalik | olgunluk | zararli
#   tetik      : bu model hangi organ bulunduğunda çalışır (organ modeli için boş)
#   siniflar   : modelin öğrendiği sınıflar (eğitim adları)
#   esik       : bu modelin genel güven eşiği (sınıf bazlı ezme: siniflar.yaml)
#   aktif      : false ise hiç çalıştırılmaz
#   zorunlu    : true ise model yoksa uyarı verilir
#
# MODEL YOKSA NE OLUR?
#     Uzman model eksikse boru hattı ÇÖKMEZ: eldeki tek modelle (miras)
#     çalışmaya devam eder. Böylece mimariye kademeli geçilir — her model
#     eğitildikçe devreye girer.

organ:
  dosya: organ.pt
  rol: organ
  # Veri kaynağı: strawberry.v2i (16.358 görüntü). Sınıf adları O DATASET'TEKİ
  # adlardır — model bu adlarla çıktı verir. Tetik eşleşmesi büyük/küçük harf
  # duyarsızdır (bkz. app/modeller.py: tetiklenen).
  # stem ve runner bu veride YOK; gerekirse sonradan etiketlenip eklenir.
  siniflar: [Flower, Fruit, Leaf]
  # ÖLÇÜLDÜ (sera fotoğrafı, 640x640 kaynak):
  #   imgsz 1024 → 2 meyve, güvenler 0.738 / 0.669 / 0.339
  #   imgsz  640 → 3 meyve, güvenler 0.841 / 0.793 / 0.608
  # Büyütmek her kutuda güveni DÜŞÜRÜYOR. 640 aynı zamanda organ
  # dataset'inin kaynak çözünürlüğü.
  imgsz: 640
  # 0.35'te sahada çok meyve kaçıyordu. Organ modeli yalnızca ROI seçer;
  # yanlış bir ROI zararsızdır (uzman model orada bir şey bulamaz), oysa
  # KAÇIRILAN organ tüm zinciri kesiyor — meyve bulunmazsa olgunluk da
  # hastalık da hiç çalışmıyor. Bu yüzden burada cömert olmak doğrudur.
  esik: 0.20
  aktif: true
  zorunlu: false
  aciklama: >
    Bitkinin hangi kısmının görüldüğünü bulur. Hastalık/olgunluk bilmez;
    yalnızca organ kutuları üretir ve akışı yönlendirir.

# ─────────────────────────────────────────────────────────────────────────
# UZMAN MODELLERİN ÇIKARIM ÇÖZÜNÜRLÜĞÜ
#
# Uzman modeller TAM görüntüyü değil ROI KIRPINTISINI görür; kırpıntılar
# 60-250 piksel arasındadır. Genel imgsz (1024) bu kırpıntıları 4-15 kat
# büyütüyordu ve model neredeyse çöküyordu.
#
# 27 gerçek fotoğraftan çıkarılan 83 ROI üzerinde ölçüldü
# (skor = ortalama güven × kaç ROI'de tespit çıktığı):
#
#   olgunluk        1024: 34/50 ROI, ort 0.380   →   128: 47/50, ort 0.459
#   meyve_hastalik  1024: 12/50 ROI, ort 0.236   →   192: 36/50, ort 0.533
#   yaprak_hastalik 1024: 17/33 ROI, ort 0.497   →   256: 27/33, ort 0.518
#
# UYARI: bu ölçüm GÜVENİ optimize eder, DOĞRULUĞU değil — elde etiketli
# saha ROI'si yok. Yön kesin (1024 yanlış), tam optimum ise 128-256
# aralığında ve etiketli veriyle yeniden ölçülmeli.
# ─────────────────────────────────────────────────────────────────────────

yaprak_hastalik:
  dosya: leaf_disease.pt
  rol: yaprak_hastalik
  tetik: [leaf]
  imgsz: 256
  # SIRA ÖNEMLİ: dataset'teki sırayla birebir aynı olmalı — eğitim ID'lerini
  # dataset belirler (datasets/<urun>/leaf_disease/data.yaml). Sıra kayarsa
  # scripts/model_kur.py kurulumu reddeder.
  siniflar: [Angular Leafspot, Leaf Spot, Powdery Mildew Leaf, Gray Mold]
  esik: 0.20
  aktif: true
  aciklama: Yalnızca yaprak ROI'lerinde çalışır. Meyveyi hiç öğrenmez.

meyve_hastalik:
  dosya: fruit_disease.pt
  rol: meyve_hastalik
  tetik: [fruit]
  imgsz: 192
  # Sıra dataset'ten gelir (datasets/<urun>/fruit_disease/data.yaml)
  siniflar: [Anthracnose Fruit Rot, Powdery Mildew Fruit, Blossom Blight, Gray Mold]
  esik: 0.20
  aktif: true
  aciklama: Yalnızca meyve ROI'lerinde çalışır.

olgunluk:
  dosya: fruit_ripeness.pt
  rol: olgunluk
  tetik: [fruit]
  imgsz: 128
  siniflar: [strawberry_unripe, strawberry_semi_ripe, strawberry_ripe]
  esik: 0.30
  aktif: true
  aciklama: >
    Yalnızca meyve ROI'lerinde çalışır. Yaprakları asla göremeyeceği için
    "yaprağı olgunlaşmamış çilek sanma" hatası yapısal olarak imkânsızdır.

zararli:
  dosya: pest_detection.pt
  rol: zararli
  tetik: [leaf, fruit]   # organ modelinde stem sınıfı yok
  siniflar: [Thrips, Spider Mites, Aphids, Whiteflies, Slug, Weevil]
  esik: 0.25
  aktif: false           # veri yok — açılırsa boru hattı boşuna model arar
  aciklama: >
    SAHA zararlı tespiti: yaprak/meyve ROI'si içinde zararlı arar.
    Henüz eğitim verisi YOK — çilek tarlasında, yaprak üzerinde çekilmiş
    görüntüler gerekir. Karıştırmayın: bocek_teshis makro böcek fotoğrafı
    üzerinde çalışır ve bu boru hattına hiç girmez.

# ─────────────────────────────────────────────────────────────────────────
# BORU HATTINA GİRMEYEN MODELLER  (rol: tekil, tetik yok)
#
# app/modeller.py: tetiklenen() yalnızca `tetik` listesinde organ adı geçen
# modelleri döner. Tetik boş olduğu için bu model ROI akışında ASLA
# çalıştırılmaz; ayrı bir kullanıcı akışından açıkça çağrılır.
# ─────────────────────────────────────────────────────────────────────────

# bocek_teshis TAŞINDI -> configs/ortak/modeller.yaml
# Böcek türü ürüne bağlı değildir; ağırlık models/bocek_teshis.pt,
# dataset datasets/bocek_teshis/. Ortak kütük her ürüne eklenir.
# Uzman modeller hazır olana kadar kullanılan eski 10 sınıflı model.
# 2026-07-31: organ + yaprak_hastalik + meyve_hastalik + olgunluk eğitilip
# kuruldu, models/cilek/best.pt kaldırıldı. Geçiş tamamlandı, bu model
# devre dışı. Geri dönmek gerekirse best.pt'yi koyup aktif: true yapın.
miras:
  dosya: best.pt
  rol: miras
  esik: 0.20
  aktif: false
  zorunlu: false
  aciklama: >
    Tek modelli eski mimari. Dört uzman model hazır olduğu için kapatıldı;
    boru hattı artık her adımda kendi uzmanını kullanıyor.
