# Sınıf kütüğü — tek yetkili liste.
#
# ANAHTAR = eğitimdeki İngilizce ad. Etiket dosyaları ve model çıktısı buna bağlıdır;
# ASLA değiştirmeyin. Değiştirirseniz eski eğitim verisi geçersiz olur.
#
# ALANLAR
#   tr / en    : ekranda görünecek ad (veritabanına yazılmaz)
#   grup       : hastalik | zararli | olgunluk | diger  → arayüzde gruplama
#   id         : etiket dosyalarındaki sayı. BİR KEZ verilir, BİR DAHA DEĞİŞMEZ.
#                Yoksa sınıf "planlanan" sayılır: etiketlemede çıkmaz.
#   egitimde   : model bu sınıfı tanıyor mu (false = yeniden eğitim bekliyor)
#   esik       : bu sınıfa özel güven eşiği (boşsa CONF_THRESHOLD kullanılır)
#   aktif      : false ise tespit hiç gösterilmez
#
# YENİ SINIF EKLEME (zararlı/hastalık):
#   python scripts/sinif_ekle.py "Spider Mites" --tr "Kırmızı Örümcek" --grup zararli
#   → boş ID atanır, strawberry_data.yaml ile eşitlenir, etiketlemede görünür.
#   Model onu ancak veri toplanıp YENİDEN EĞİTİLDİKTEN sonra tanır.

# ─────────────────────────────────────────────────────── hastalıklar (eğitimde)
Angular Leafspot:
  tr: Köşeli Yaprak Lekesi
  en: Angular Leaf Spot
  grup: hastalik
