  tr: Antraknoz Meyve Çürüklüğü
  en: Anthracnose Fruit Rot
  grup: hastalik
Blossom Blight:
  tr: Çiçek Yanıklığı
  en: Blossom Blight
  grup: hastalik
Gray Mold:
  tr: Kurşuni Küf (Botrytis)
  en: Gray Mold (Botrytis)
  grup: hastalik
Leaf Spot:
  tr: Yaprak Lekesi
  en: Leaf Spot
  grup: hastalik
Powdery Mildew Fruit:
  tr: Külleme (Meyve)
  en: Powdery Mildew (Fruit)
  grup: hastalik
Powdery Mildew Leaf:
  tr: Külleme (Yaprak)
  en: Powdery Mildew (Leaf)
  grup: hastalik

# ─────────────────────────────────────────────────────── olgunluk (eğitimde)
# Bu sınıflar ayrı bir veri setinden geldi ve orada olgunlaşmamış çilek YEŞİL
# görünüyor. Model "yeşil yuvarlak kütle" ile çilek YAPRAĞINI karıştırıyor:
# bütün bitki fotoğrafında yaprakları strawberry_unripe sanıyor.
#
# Bu yüzden eşik yükseltildi ve unripe KAPATILDI. Kalıcı çözüm: yaprak/bitki
# fotoğraflarını negatif örnek olarak toplayıp yeniden eğitmek (README 2b).
# Meyve olgunluğu takibi isterseniz `aktif: true` yapın.
# ÖLÇÜM — üretimdeki model: strawberry_ince_ayar (ince ayar, 60 epoch)
#
# NEDEN BU MODEL? Uygulamanın asıl işi HASTALIK tespiti. Aynı test setinde:
#   mAP50-95 0.228 -> 0.477 ve 10 sınıfın hepsi iyileşti.
#   Anthracnose Fruit Rot: 0.124 -> 0.517 (4 kat)
# Sahadan gelen bir fotoğrafta üretim modeli conf 0.05'te bile HİÇ hastalık
# bulamazken bu model antraknoz lezyonlarını doğru yerde işaretledi (%20-24).
#
# BEDELİ: olgunluk sınıflarında daha az güvenli ve büyük/farklı çözünürlüklü
# görüntülerde meyve tespiti eski modelden zayıf. Eşikler buna göre ayarlandı.
#
# ⚠️ Bu modelin güven kalibrasyonu eskisinden FARKLI. Eski model için ayarlanmış
# yüksek eşikler (0.70-0.80) burada her şeyi eler. Modeli değiştirirseniz
# eşikleri YENİDEN ÖLÇÜN.
strawberry_ripe:
  tr: Olgun Çilek
  en: Ripe Strawberry
  grup: olgunluk
  esik: 0.30        # bu modelde ölçülen: medyan 0.27 · max 0.56
strawberry_semi_ripe:
  tr: Yarı Olgun Çilek
  en: Semi-ripe Strawberry
  grup: olgunluk
  esik: 0.30
strawberry_unripe:
  tr: Olgunlaşmamış Çilek
  en: Unripe Strawberry
  grup: olgunluk
  # gerçek meyve medyan 0.40 · yaprak yanlış pozitifleri max 0.37 (eskiden 0.79)
  esik: 0.40
  aktif: true

