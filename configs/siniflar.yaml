# ─────────────────────────────────────────────────────── olgunluk (eğitimde)
# Bu sınıflar ayrı bir veri setinden geldi ve orada olgunlaşmamış çilek YEŞİL
# görünüyor. Model "yeşil yuvarlak kütle" ile çilek YAPRAĞINI karıştırıyor:
# bütün bitki fotoğrafında yaprakları strawberry_unripe sanıyor.
#
# Bu yüzden eşik yükseltildi ve unripe KAPATILDI. Kalıcı çözüm: yaprak/bitki
# fotoğraflarını negatif örnek olarak toplayıp yeniden eğitmek (README 2b).
# Meyve olgunluğu takibi isterseniz `aktif: true` yapın.
strawberry_ripe:
  tr: Olgun Çilek
  en: Ripe Strawberry
  grup: olgunluk
  esik: 0.70
strawberry_semi_ripe:
  tr: Yarı Olgun Çilek
  en: Semi-ripe Strawberry
  grup: olgunluk
  esik: 0.75
strawberry_unripe:
  tr: Olgunlaşmamış Çilek
  en: Unripe Strawberry
  grup: olgunluk
  # ÖLÇÜM — ince ayar öncesi/sonrası (aynı görseller, aynı yöntem):
  #
  #   EC 4.4 yaprak fotoğrafı (yanlış pozitif kaynağı)
  #     eski model : 0.79 · 0.75 · 0.69   → yaprakları çilek sanıyordu
  #     yeni model : 0.37 · 0.24          → karışıklık büyük ölçüde çözüldü
  #
  #   Gerçek olgunlaşmamış meyve (v13'ten 12 görsel)
  #     yeni model : min 0.20 · medyan 0.40 · max 0.95
  #
  # Eski modelde iki grup üst üste biniyordu ve 0.80 gibi yüksek bir eşik
  # şarttı (gerçeklerin %80'i de eleniyordu). İnce ayar sonrası ayrıştılar:
  # 0.45, yaprak yanlış pozitiflerinin (max 0.37) üstünde güvenli bir
  # payla durur ve gerçek meyvelerin çoğunu geçirir.
  #
  # Bu ölçümü modeli her değiştirdiğinizde tekrarlayın — eşik modele bağlıdır.
  esik: 0.45
  aktif: true

