# ─────────────────────────────────────────────────────── olgunluk (eğitimde)
# Bu sınıflar ayrı bir veri setinden geldi ve orada olgunlaşmamış çilek YEŞİL
# görünüyor. Model "yeşil yuvarlak kütle" ile çilek YAPRAĞINI karıştırıyor:
# bütün bitki fotoğrafında yaprakları strawberry_unripe sanıyor.
#
# Bu yüzden eşik yükseltildi ve unripe KAPATILDI. Kalıcı çözüm: yaprak/bitki
# fotoğraflarını negatif örnek olarak toplayıp yeniden eğitmek (README 2b).
# Meyve olgunluğu takibi isterseniz `aktif: true` yapın.
strawberry_ripe:
  tr: Olgun Çilek
  en: Ripe Strawberry
  grup: olgunluk
  esik: 0.70
strawberry_semi_ripe:
  tr: Yarı Olgun Çilek
  en: Semi-ripe Strawberry
  grup: olgunluk
  esik: 0.75
strawberry_unripe:
  tr: Olgunlaşmamış Çilek
  en: Unripe Strawberry
  grup: olgunluk
  # ÖLÇÜM (mevcut model, v13'ten unripe içeren 12 görsel, 51 tespit):
  #   gerçek olgunlaşmamış çilek : min 0.21 · medyan 0.58 · max 0.94
  #   yaprak yanlış pozitifleri  : 0.69 · 0.75 · 0.79   (EC 4.4 fotoğrafı)
  # İki grup ÜST ÜSTE BİNİYOR; temiz ayıran eşik yok. 0.80 en iyi taviz:
  #   yaprakların tamamı elenir, en belirgin meyveler (10/51) görünür.
  # Eşiği düşürürseniz daha çok meyve yakalarsınız ama yapraklar da girer.
  # Kalıcı çözüm: v13'teki 346 gerçek unripe örneği + 96 sağlıklı yaprak
  # background'u ile yeniden eğitim (ince ayar). Sonra bu ölçümü tekrarlayın.
  esik: 0.80
  aktif: true

