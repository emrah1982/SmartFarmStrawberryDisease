# ÖNEMLİ: Buradaki anahtarlar (Angular Leafspot, strawberry_unripe ...) EĞİTİMDEKİ
# adlardır ve DEĞİŞTİRİLEMEZ — etiket dosyaları, dışa aktarım ve yeniden eğitim
# bunlara bağlıdır. Bu dosya yalnızca EKRAN görünümünü belirler; veritabanına ve
# eğitim verisine her zaman İngilizce ad yazılır.
