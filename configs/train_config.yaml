# Strawberry Vision - YOLO26 Training Configuration
# YOLO26: NMS-free, DFL-free, edge-dostu güncel Ultralytics mimarisi.
# Dataset formatı YOLOv8 ile birebir aynıdır — veri tarafında değişiklik gerekmez.

# Model selection
model: yolo26s.pt  # Options: yolo26n.pt, yolo26s.pt, yolo26m.pt, yolo26l.pt, yolo26x.pt
                   # 's' seçildi: küçük hastalık lezyonlarında 'n'den belirgin daha iyi doğruluk,
                   # Colab T4 GPU'da hala rahat eğitilir. Telefon/edge dağıtımında 'n' deneyin;
                   # bulut API'de 'm' ile doğruluk kazanabilirsiniz.

# Training parameters
epochs: 200       # Fine-tune senaryosunda uzun eğitim + early stopping daha iyi sonuç verir
batch: 8          # imgsz 1024 için düşürüldü (VRAM); imgsz 640'a dönerseniz 16 yapın
imgsz: 1024       # Erken evre lezyonlar (leaf spot vb.) 640'ta birkaç piksele düşüyor;
                  # 1024 küçük lekelerin tespitini belirgin iyileştirir. VRAM yetmezse 640 + SAHI kullanın.
device: 0  # GPU device ID (0, 1, 2, ...) or 'cpu'
workers: 8  # Number of dataloader workers

# Optimizer settings
optimizer: auto   # YOLO26 için önerilen: Ultralytics, mimariye uygun optimizer'ı (MuSGD) ve
                  # lr0/momentum değerlerini otomatik seçer. Manuel kontrol isterseniz
                  # AdamW + lr0: 0.002 kullanın (0.01 SGD içindir, AdamW ile eğitimi bozar).
lr0: 0.002        # optimizer: auto iken YOK SAYILIR; manuel AdamW'a geçerseniz geçerli olur
lrf: 0.01         # Final learning rate (lr0 * lrf)
momentum: 0.937   # optimizer: auto iken yok sayılır
weight_decay: 0.0005  # Optimizer weight decay

# Loss weights
box: 7.5   # Box loss gain
cls: 0.5   # Class loss gain
dfl: 1.5   # DFL loss gain — YOLO26 DFL-free mimaridir, bu ağırlık YOLO26'da yok sayılır (YOLOv8'e dönerseniz geçerli)

# Data augmentation
# NOT: Hastalık teşhisinde RENK ayırt edici özelliktir (kahverengi leke, gri küf,
# beyaz külleme). Hue/saturation'ı agresif oynatmak sınıflar arası renk ipuçlarını bozar.
hsv_h: 0.02       # HSV-Hue augmentation (fraction) — düşük tutuldu, renk tonu hastalık sinyalidir
hsv_s: 0.5        # HSV-Saturation augmentation (0.8'den düşürüldü; agresif doygunluk kaydırması renk ipuçlarını bozuyordu)
hsv_v: 0.5        # HSV-Value augmentation (fraction)
degrees: 10.0     # Image rotation (+/- deg)
translate: 0.1    # Image translation (+/- fraction)
scale: 0.6        # Image scale (+/- gain)
shear: 0.0        # Image shear (+/- deg)
perspective: 0.001  # Image perspective (+/- fraction)
flipud: 0.0       # Image flip up-down (probability)
fliplr: 0.5       # Image flip left-right (probability)
mosaic: 1.0       # Mosaic augmentation (probability)
mixup: 0.1        # Mixup augmentation (probability)
copy_paste: 0.0   # Copy-paste augmentation (probability)

# Validation settings
val: true         # Validate during training
save: true        # Save checkpoints
save_period: 10   # Save checkpoint every x epochs
plots: true       # Save plots and images
conf: 0.25        # Confidence threshold for predictions
iou: 0.7          # IoU threshold for NMS — YOLO26 NMS-free çalışır, inference'ta bu eşik etkisizdir (val eşleştirmesinde kullanılır)

# Advanced settings
patience: 50      # Early stopping patience (epochs)
resume: false     # Resume training from last checkpoint
amp: true         # Automatic Mixed Precision training
fraction: 1.0     # Dataset fraction to train on
profile: false    # Profile ONNX and TensorRT speeds
freeze: null      # Freeze layers (e.g., [0, 1, 2])
multi_scale: false # Multi-scale training

# Project settings
project: runs/train  # Project directory
name: strawberry_exp # Experiment name
exist_ok: false      # Overwrite existing experiment
pretrained: true     # Use pretrained model
verbose: true        # Verbose output
seed: 0              # Random seed for reproducibility
deterministic: true  # Deterministic mode
single_cls: false    # Train as single-class dataset
rect: false          # Rectangular training
cos_lr: true         # Cosine LR: uzun eğitimde (200 epoch) sona doğru yumuşak azalma daha iyi yakınsama sağlar
close_mosaic: 20     # Disable mosaic augmentation for final epochs
