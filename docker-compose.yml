services:
  web:
    build:
      context: .
      # GPU kullanacaksanız:
      # args:
      #   TORCH_INDEX: https://download.pytorch.org/whl/cu121
    image: cilek-tespit:latest
    container_name: cilek-tespit
    ports:
      - "8000:8000"
      # https (canli kamera icin) — certs/ altinda sertifika varsa acilir
      - "8443:8443"
    volumes:
      # Model imaja gömülmez — güncellemek için sadece dosyayı değiştirin
      - ./models:/app/models:ro
      # Kayıtlar ve yüklenen görseller konteyner silinse de kalır
      - ./storage:/app/storage
      # Tedavi önerilerini yeniden derlemeden düzenleyebilmek için
      # Ürün yapılandırmaları (tedavi önerileri, sınıf kütüğü, model kütüğü).
      # Tek klasör bağlanır: yeni bitki eklendiğinde compose değişmez.
      - ./configs/urunler:/app/configs/urunler:ro
      # HTTPS sertifikası (varsa otomatik kullanılır — canlı kamera için şart)
      #   python scripts/https_sertifika.py  ile üretilir
      - ./certs:/app/certs:ro
    environment:
      # Ürün kapsamlı: models/<urun>/ altından okunur (bkz. app/urunler.py)
      MODEL_PATH: /app/models/cilek/best.pt
      VARSAYILAN_URUN: cilek
      # 0.20: sahada hastalik lezyonlari dusuk guvenle bulunabiliyor (orn.
      # antraknoz %20-24). REVIEW_THRESHOLD 0.55 oldugu icin bu tespitler
      # zaten inceleme kuyruguna dusuyor — kacirmaktansa uzman onayina gitsin.
      CONF_THRESHOLD: "0.20"
      REVIEW_THRESHOLD: "0.55"
      IMGSZ: "1024"
    restart: unless-stopped

    # --- GPU (NVIDIA) ---
    # Windows'ta WSL2 + NVIDIA Container Toolkit gerekir.
    # Yukarıdaki build args'ı CUDA yapıp aşağıyı açın:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
